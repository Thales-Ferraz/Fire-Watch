<div id="dashAlerta" class="alert" hidden>
  ⚠️
  <span id="dashAlertaTexto"></span>
</div>

<div class="stats" id="dashStats">
  <div class="stat-card c-fire">
    <div class="stat-label">Denúncias em verificação</div>
    <div class="stat-value fire" data-card="emVerificacao">—</div>
    <div class="stat-note" data-nota="emVerificacao">carregando…</div>
  </div>
  <div class="stat-card c-danger">
    <div class="stat-label">Denúncias pendentes</div>
    <div class="stat-value danger" data-card="pendentes">—</div>
    <div class="stat-note" data-nota="pendentes">carregando…</div>
  </div>
  <div class="stat-card c-ember">
    <div class="stat-label">Focos do dia</div>
    <div class="stat-value ember" data-card="focosHoje">—</div>
    <div class="stat-note" data-nota="focosHoje">carregando…</div>
  </div>
  <div class="stat-card c-green">
    <div class="stat-label">Resolvidas hoje</div>
    <div class="stat-value green" data-card="resolvidasHoje">—</div>
    <div class="stat-note" data-nota="resolvidasHoje">carregando…</div>
  </div>
</div>

<div class="row">
  <div class="map-box">
    <div class="map-header">
      <span style="font-size: 16px">🔥</span>
      <h3>Mapa de Focos Ativos</h3>
    </div>

    <div style="flex: 1; position: relative">
      <div
        id="map"
        style="position: absolute; inset: 0; width: 100%; height: 100%"
      ></div>
    </div>
  </div>

  <div class="incidents-box">
    <div class="incidents-header">
      Denúncias por Estado
      <span id="dashGraficoTotal"></span>
    </div>
    <div style="padding: 16px; height: 330px; position: relative">
      <canvas id="graficoEstados" aria-label="Gráfico de denúncias por estado" role="img"></canvas>
    </div>
  </div>
</div>

<div class="incidents-box" style="margin-top: 14px">
  <div class="incidents-header">
    Ocorrências recentes
    <span id="dashRecentesTotal"></span>
  </div>
  <div id="dashRecentes"></div>
</div>
