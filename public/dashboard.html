<div id="dashAlerta" class="alert" role="alert" hidden>
  <span class="alert-icone"><svg class="ico" aria-hidden="true"><use href="#i-sirene"></use></svg></span>
  <span id="dashAlertaTexto"></span>
</div>

<div class="stats" id="dashStats">
  <article class="stat-card st-cor-fogo">
    <div class="stat-topo">
      <span class="stat-label">Em verificação</span>
      <span class="stat-icone"><svg class="ico" aria-hidden="true"><use href="#i-atividade"></use></svg></span>
    </div>
    <div class="stat-value num" data-card="emVerificacao">—</div>
    <div class="stat-note" data-nota="emVerificacao">carregando…</div>
  </article>
  <article class="stat-card st-cor-info">
    <div class="stat-topo">
      <span class="stat-label">Pendentes</span>
      <span class="stat-icone"><svg class="ico" aria-hidden="true"><use href="#i-relogio"></use></svg></span>
    </div>
    <div class="stat-value num" data-card="pendentes">—</div>
    <div class="stat-note" data-nota="pendentes">carregando…</div>
  </article>
  <article class="stat-card st-cor-perigo">
    <div class="stat-topo">
      <span class="stat-label">Focos do dia</span>
      <span class="stat-icone"><svg class="ico" aria-hidden="true"><use href="#i-flame"></use></svg></span>
    </div>
    <div class="stat-value num" data-card="focosHoje">—</div>
    <div class="stat-note" data-nota="focosHoje">carregando…</div>
  </article>
  <article class="stat-card st-cor-sucesso">
    <div class="stat-topo">
      <span class="stat-label">Resolvidas hoje</span>
      <span class="stat-icone"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></span>
    </div>
    <div class="stat-value num" data-card="resolvidasHoje">—</div>
    <div class="stat-note" data-nota="resolvidasHoje">carregando…</div>
  </article>
</div>

<div class="row">
  <section class="painel painel-mapa" aria-labelledby="tituloMapa">
    <div class="painel-cabecalho">
      <h2 id="tituloMapa">
        <svg class="ico" aria-hidden="true"><use href="#i-pino"></use></svg> Mapa de focos ativos
      </h2>
      <ul class="legenda" aria-label="Legenda de gravidade">
        <li><span class="legenda-ponto grav-baixa"></span>Baixa</li>
        <li><span class="legenda-ponto grav-media"></span>Média</li>
        <li><span class="legenda-ponto grav-alta"></span>Alta</li>
        <li><span class="legenda-ponto grav-critica"></span>Crítica</li>
      </ul>
    </div>
    <div class="map-corpo">
      <div id="map" role="region" aria-label="Mapa interativo com os focos ativos"></div>
    </div>
  </section>

  <section class="painel">
    <div class="painel-cabecalho">
      <h2><svg class="ico" aria-hidden="true"><use href="#i-grafico"></use></svg> Denúncias por estado</h2>
      <span id="dashGraficoTotal" class="painel-meta"></span>
    </div>
    <div class="grafico-corpo">
      <canvas id="graficoEstados" role="img" aria-label="Gráfico de barras com o número de denúncias por estado"></canvas>
    </div>
  </section>
</div>

<section class="painel painel-recentes">
  <div class="painel-cabecalho">
    <h2><svg class="ico" aria-hidden="true"><use href="#i-atividade"></use></svg> Ocorrências recentes</h2>
    <span id="dashRecentesTotal" class="painel-meta"></span>
  </div>
  <div id="dashRecentes"></div>
</section>
