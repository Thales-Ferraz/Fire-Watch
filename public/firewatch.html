<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FireWatch – Monitoramento de Queimadas</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
    <script src="https://api.mapbox.com/search-js/v1.0.0-beta.22/web.js"></script>
  </head>

  <body>
    <nav class="sidebar">
      <div class="sidebar-logo">
        <span class="flame-icon">🔥</span>
        Fire<span>Watch</span>
      </div>

      <div class="sidebar-nav">
        <button
          class="nav-item active"
          onclick="(setNav(this), abrirDashboard())"
        >
          <span class="icon">▦</span> Dashboard
        </button>

        <button class="nav-item" onclick="(setNav(this), abrirHistorico())">
          <span class="icon">⏱</span> Histórico
          <span class="nav-badge"></span>
        </button>

        <button class="nav-item" onclick="(setNav(this), abrirForum())">
          <span class="icon">💬</span> Fórum
        </button>

        <button class="nav-item" onclick="(setNav(this), abrirCatalogo())">
          <span class="icon">⚠️</span> Catálogo de Prevenção
        </button>

        <!-- ÁREA EXCLUSIVA DO ÓRGÃO -->
        <div id="areaOrgao" style="display: none">
          <button
            class="nav-item"
            onclick="(setNav(this), abrirGerenciarDenuncias())"
          >
            <span class="icon">📋</span> Gerenciar Denúncias
          </button>
        </div>

        <!-- ÁREA EXCLUSIVA DO ADMINISTRADOR -->
        <div id="areaAdmin" style="display: none">
          <button
            class="nav-item"
            onclick="(setNav(this), abrirAprovacaoOrgaos())"
          >
            <span class="icon">🛡️</span> Aprovar Órgãos
          </button>
        </div>

        <div style="margin-top: auto; padding-top: 16px">
          <button class="nav-report" onclick="abrirModal()">
            <span class="icon">＋</span> Nova Denúncia
          </button>
        </div>
      </div>
    </nav>

    <div class="main">
      <header>
        <div class="header-left">
          <div class="header-title">Dashboard de Monitoramento</div>
          <div class="header-sub">
            Canal transparente de dados e focos ativos de incêndio em tempo real
          </div>
        </div>

        <div class="header-right">
          <!-- VISÍVEL QUANDO NÃO ESTIVER LOGADO -->
          <div id="areaVisitante">
            <button
              class="btn-login"
              onclick="window.location.href = 'login.html'"
            >
              Entrar
            </button>
            <button
              class="btn-register"
              onclick="window.location.href = 'cadastro_pessoa.html'"
            >
              Cadastrar-se
            </button>
          </div>

          <!-- VISÍVEL QUANDO ESTIVER LOGADO -->
          <div
            id="areaUsuario"
            style="display: none; align-items: center; gap: 12px"
          >
            <span id="nomeUsuario"></span>
            <button class="btn-login" onclick="logout()">Sair</button>
          </div>
        </div>
      </header>

      <div class="content">
        <p class="carregando">Carregando dashboard…</p>
      </div>
    </div>

    <div id="modalDenuncia" class="modal-overlay">
      <div id="conteudoModal"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/constantes.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/home-auth.js"></script>
    <script src="assets/js/admin.js"></script>
    <script src="assets/js/historico.js"></script>
    <script src="assets/js/denuncia.js"></script>
    <script src="assets/js/catalogo.js"></script>
    <script src="assets/js/gerencia.js"></script>
    <script src="assets/js/mapa.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script src="assets/js/forum.js"></script>
  </body>
</html>
